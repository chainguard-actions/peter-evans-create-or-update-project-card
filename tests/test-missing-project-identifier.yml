name: Test failure when no project identifier is supplied
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Neither project-number nor project-name is provided — the action should fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          column-name: "To do"

      - name: Assert action failed due to missing project identifier
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no project identifier was supplied"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a project-number or project-name"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
