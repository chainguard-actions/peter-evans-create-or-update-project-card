name: Test usage with explicit project-location (org)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project-location: "peter-evans"
          project-number: 1
          column-name: "Backlog"

      - name: Assert action ran and produced card-id or failed gracefully on sentinel org
        env:
          CARD_ID: ${{ steps.action.outputs.card-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "card-id: $CARD_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CARD_ID" ]; then
              echo "FAIL: action succeeded but card-id output is empty"
              exit 1
            fi
            echo "PASS: got card-id '$CARD_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (org/project not accessible from harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
