name: Test create-or-update-project-card with project-number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          project-location: ${{ github.repository }}
          project-number: "1"
          column-name: "To do"
          repository: ${{ github.repository }}
          issue-number: "1"
      - name: Assert action was invoked
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail due to no real project existing in the test environment,
          # but it must have been invoked (not skipped). Valid outcomes are success or failure.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with project-number and column-name"
